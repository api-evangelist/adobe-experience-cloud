provider:
  name: Adobe Identity Management System (IMS)
  issuer: https://ims-na1.adobelogin.com
  discovery: https://ims-na1.adobelogin.com/.well-known/openid-configuration
  discovery_http_status: 200
  authorization_endpoint: https://ims-na1.adobelogin.com/ims/authorize/v2
  token_endpoint: https://ims-na1.adobelogin.com/ims/token/v3
  jwks_uri: https://ims-na1.adobelogin.com/ims/keys
  scopes_supported:
    - openid
    - email
    - profile
  probed: '2026-08-13'
required_together:
  note: >-
    Both credentials are required on every Experience Cloud API call. A valid bearer token
    WITHOUT x-api-key returns 401; a correctly authenticated identity with no product
    profile granted in the Adobe Admin Console returns 403. 41 of 110 operations declare
    401 and 4 declare 403.
  headers:
    - Authorization
    - x-api-key
    - x-gw-ims-org-id
  conditional:
    - header: x-gw-ims-org-id
      required_by:
        - Adobe Experience Platform
        - Adobe Journey Optimizer
        - the Adobe Analytics and CJA MCP servers
      note: Not declared as a parameter in any spec in this repo, but documented by Adobe
        and required by the MCP servers.
    - header: x-sandbox-name
      required_by:
        - Adobe Experience Platform
        - Adobe Journey Optimizer
      note: Selects the sandbox. See sandbox/adobe-experience-cloud-sandbox.yml.
credential_flow:
  console: https://developer.adobe.com/console/
  steps:
    - Configure product permissions for the developer in the Adobe Admin Console
      (adminconsole.adobe.com).
    - Create a client configuration (project + workspace) in the Adobe Developer Console.
    - Obtain OAuth Server-to-Server credentials; exchange them at
      https://ims-na1.adobelogin.com/ims/token/v3 for a short-lived access token.
  source: https://developer.adobe.com/analytics-apis/docs/2.0/guides/
cross_ref:
