generated: '2026-08-13'
method: probed
source: live HTTPS probes of every apis.yml / OpenAPI servers[] host plus the Adobe IMS
  and Adobe-hosted MCP authorization hosts
description: >-
  /.well-known/ probe of every host Adobe Experience Cloud serves an API or a docs
  console from. Two real documents are served: a PGP-signed security.txt on adobe.com,
  and full OAuth 2.0 / OpenID Connect discovery metadata on Adobe IMS
  (ims-na1.adobelogin.com) and on the three authorization servers that front Adobe's
  hosted MCP endpoints. The API hosts themselves (analytics.adobe.io, platform.adobe.io,
  mc.adobe.io) serve nothing under /.well-known/.
notes: >-
  developer.adobe.com and adobe.io are single-page-application catch-alls: EVERY
  /.well-known/ path returns HTTP 200 with the same 1,203,904-byte HTML shell. These
  are recorded as soft-200 misses, not hits. Only the adobe.com security.txt and the
  IMS / MCP OAuth metadata documents below are real documents.
summary:
  hosts_probed: 10
  paths_probed: 40
  real_documents: 7
  soft_200_html_shells: 14
hosts:
  - host: adobe.com
    paths:
      - path: /.well-known/security.txt
        status: 200
        content_type: text/plain
        document: true
        file: well-known/adobe-experience-cloud-security.txt
        note: PGP-signed RFC 9116 security.txt; Expires 2027-07-30.
  - host: ims-na1.adobelogin.com
    role: Adobe Identity Management System (IMS) — the OAuth/OIDC provider for every
      Experience Cloud API
    paths:
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        document: true
        file: well-known/adobe-experience-cloud-ims-openid-configuration.json
      - path: /.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        document: true
        file: well-known/adobe-experience-cloud-ims-oauth-authorization-server.json
  - host: oauth.adobeaemcloud.com
