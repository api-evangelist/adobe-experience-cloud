description: >-
  Client-side and embeddable surfaces Adobe ships for Experience Cloud, as distinct from
  the server-side SDKs in packages/. Three families: the Edge Network collectors that run
  in the browser and render personalization (Web SDK, Client Data Layer), the AEM
  headless/SPA client libraries that render Adobe-managed content inside a customer app,
  and the Spectrum design-system component libraries (web components and React) that make
  a customer UI look like an Adobe product.
