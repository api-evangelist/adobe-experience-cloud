  family_count: 3
  component_count: 6
families:
  - family: Edge Network / personalization runtime
    description: >-
      Browser libraries that send events to the Adobe Experience Platform Edge Network and
      render Target / Offer Decisioning personalization in the page. This is where
      Experience Cloud actually touches an end user's browser.
    components:
      - name: Adobe Experience Platform Web SDK
        package: '@adobe/alloy'
        registry: npm
        version: 2.35.0
        published: '2026-07-30'
        repository: https://github.com/adobe/alloy
        official: true
        loader: true
        cdn:
          available: true
          jsdelivr_api: https://data.jsdelivr.com/v1/packages/npm/@adobe/alloy
          note: >-
            Distributed both as an npm package and as a CDN build. Adobe's own
            documentation ships a base-code snippet that loads alloy.js from the customer's
            own hosted copy or from the Adobe Experience Platform Tags (Launch) library, so
            the deployed version depends on the customer's tag property rather than on a
            pinned URL.
        supersedes:
          - at.js (Adobe Target)
          - AppMeasurement.js (Adobe Analytics)
