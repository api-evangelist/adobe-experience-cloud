  Adobe's client-library strategy is Node-first: the Adobe I/O (aio) library family on
  npm covers Analytics, Target, Campaign Standard, Real-Time Customer Profile and I/O
  Events, with a single Python package (aepp) for Experience Platform and a Java library
  family for I/O Events / IMS. Every entry below carries the version and publish date
  read from the registry metadata endpoint, not from prose.
