mcp_only:
  - tool: setSessionDefaults
    reason: Client-side session state (reportSuiteId + globalCompanyId). The REST API
      carries these as a path parameter and a header on every call instead.
  - tool: searchDimensionItems
    reason: Item-value search inside a dimension. Adobe Analytics 2.0 exposes dimension
      items only as report breakdowns, not as a dedicated REST search endpoint, so this
      tool composes a report request rather than mapping 1:1.
  - tool: listComponentUsage
    reason: Component usage reporting. No public Analytics 2.0 REST operation in this
      repo's contract.
  - tool: findDataViews
    reason: Customer Journey Analytics data views. CJA has its own API (cja.adobe.io) that
      is not captured in this repo's OpenAPI set.
  - tool: setDefaultSessionDataViewId
    reason: CJA session state; no REST equivalent.
  - tool: get-aem-page-content
    reason: AEM as a Cloud Service content tool. AEM has no OpenAPI in this repo.
rest_only_note: Representative operations with a published REST contract and no agent
  tool — the gap between what Experience Cloud can do over HTTP and what it can do over MCP.
