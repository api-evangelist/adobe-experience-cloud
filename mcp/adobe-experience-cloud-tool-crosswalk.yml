description: >-
  Binds each Adobe Analytics / CJA MCP tool to the Adobe Analytics 2.0 REST operation it
  backs, so an agent can see which tool inherits which operation's parameters and request
  body. The live MCP schemas are OAuth-gated (tools/list returns 401), so every binding
  below is by name and semantics against the published REST contract, and confidence is
  set accordingly. Nothing here was invented: every `rest` value is an operationId that
  exists in this repo's OpenAPI, and every `tool` value is a name Adobe itself invokes in
  its published agent skills.
surfaces:
  openapi:
    - openapi/adobe-experience-cloud-reports-api-openapi.yml
    - openapi/adobe-experience-cloud-report-suites-api-openapi.yml
    - openapi/adobe-experience-cloud-metrics-api-openapi.yml
    - openapi/adobe-experience-cloud-dimensions-api-openapi.yml
    - openapi/adobe-experience-cloud-segments-api-openapi.yml
    - openapi/adobe-experience-cloud-calculated-metrics-api-openapi.yml
  mcp:
    - url: https://aa-mcp.adobe.io/mcp
      gated: true
      gate: OAuth (Adobe IMS) — anonymous tools/list returns 401
    - url: https://cja-mcp.adobe.io/mcp
      gated: true
      gate: OAuth (Adobe IMS) — anonymous tools/list returns 401
  graphql: null
coverage:
