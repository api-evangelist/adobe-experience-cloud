method: probed
source: https://oauth.adobeaemcloud.com/.well-known/oauth-authorization-server,
  https://aa-mcp.adobe.io/.well-known/oauth-authorization-server,
  https://cja-mcp.adobe.io/.well-known/oauth-authorization-server,
